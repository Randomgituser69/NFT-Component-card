<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="picture">
          <button aria-label="Enlarge Equilibrium #3429 image">
            <img src="image-equilibrium.jpg" alt="Equilibrium" />
          </button>
        </div>
        <h2><a href="#">Equilibrium #3429</a></h2>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="price">
          <div class="price-info">
            <i id="eth">
              <img src="icon-ethereum.svg" alt="etherum icon" />
            </i>
            <p>0.041 ETH</p>
          </div>
          <div class="price-info">
            <i id="clock">
              <img src="icon-clock.svg" alt="clock icon" />
            </i>
            <span>3 days left</span>
          </div>
        </div>
        <div class="credit">
          <img src="image-avatar.png" alt="profile of Jules" />
          <p>Creation of <a href="#">Jules Wyvern</a></p>
        </div>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by
        <a href="https://www.frontendmentor.io/profile/Randomgituser69"
          >Tahsin</a
        >.
      </div>
    </footer>
  </body>
</html>
